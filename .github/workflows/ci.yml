name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # enables manual trigger from GitHub Actions UI

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 app.py --count --select=E9,F63,F7,F82 --show-source --statistics
          # warn on style issues but don't fail
          flake8 app.py --count --max-line-length=120 --statistics --exit-zero

      - name: Check app imports correctly
        run: python -c "import app"
        env:
          MONGODB_URI: mongodb://localhost:27017/
          SECRET_KEY: ci-test-secret-key

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t socialvoyage:${{ github.sha }} .

      - name: Verify container starts
        run: |
          docker run -d \
            --name socialvoyage-test \
            -e MONGODB_URI=mongodb://localhost:27017/ \
            -e SECRET_KEY=ci-test-secret-key \
            -p 5000:5000 \
            socialvoyage:${{ github.sha }}
          sleep 5
          docker ps | grep socialvoyage-test
          docker stop socialvoyage-test
